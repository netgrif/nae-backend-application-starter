# Netgrif Engine
netgrif.engine.main.allow-bean-definition-overriding=true
netgrif.engine.main.allow-circular-references=true
netgrif.engine.main.auto-configure-exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Logging
logging.config=classpath:logback-spring.xml
netgrif.engine.logging.file.path=log
netgrif.engine.logging.endpoints=false

# REST and serialization
netgrif.engine.data.rest.base-path=/api
netgrif.engine.data.rest.detection-strategy=annotated
netgrif.engine.jackson.default-property-inclusion=non_null
netgrif.engine.jackson.serialization.write-dates-as-timestamps=true
netgrif.engine.servlet.multipart.max-file-size=50MB
netgrif.engine.servlet.multipart.max-request-size=50MB

# MongoDB
netgrif.engine.data.database-name=${NETGRIF_ENGINE_DATA_DATABASE_NAME:nae}
netgrif.engine.data.drop=false
netgrif.engine.data.mongodb.uri=${NETGRIF_ENGINE_DATA_MONGODB_URI:mongodb://localhost:27017}
netgrif.engine.data.mongodb.auto-index-creation=true
netgrif.engine.data.mongodb.runner-ensure-index=true

# Elasticsearch
netgrif.engine.data.elasticsearch.url=${NETGRIF_ENGINE_DATA_ELASTIC_URL:localhost}
netgrif.engine.data.elasticsearch.port=${NETGRIF_ENGINE_DATA_ELASTIC_PORT:9300}
netgrif.engine.data.elasticsearch.search-port=${NETGRIF_ENGINE_DATA_ELASTIC_SEARCH_PORT:9200}
netgrif.engine.data.elasticsearch.index.petriNet=${NETGRIF_ENGINE_DATA_DATABASE_NAME:nae}_petrinet
netgrif.engine.data.elasticsearch.index.case=${NETGRIF_ENGINE_DATA_DATABASE_NAME:nae}_case
netgrif.engine.data.elasticsearch.index.task=${NETGRIF_ENGINE_DATA_DATABASE_NAME:nae}_task
netgrif.engine.data.elasticsearch.executors.size=500
netgrif.engine.data.elasticsearch.executors.timeout=5
netgrif.engine.data.elasticsearch.reindex=0 0 * * * *
netgrif.engine.data.elasticsearch.reindex-executor.size=20
netgrif.engine.data.elasticsearch.reindex-executor.timeout=60

# Redis session
netgrif.engine.data.redis.host=${NETGRIF_ENGINE_DATA_REDIS_HOST:localhost}
netgrif.engine.data.redis.port=${NETGRIF_ENGINE_DATA_REDIS_PORT:6379}
netgrif.engine.data.redis.session.namespace=${NETGRIF_ENGINE_DATA_REDIS_SESSION_NAMESPACE:netgrif}

# Mail
netgrif.engine.mail.mail-from=${NETGRIF_ENGINE_MAIL_FROM:test@example.com}
netgrif.engine.mail.redirect-to.domain=${NETGRIF_ENGINE_MAIL_REDIRECT_TO_DOMAIN:localhost}
netgrif.engine.mail.redirect-to.port=${NETGRIF_ENGINE_MAIL_REDIRECT_TO_PORT:4200}
netgrif.engine.mail.redirect-to.ssl=${NETGRIF_ENGINE_MAIL_REDIRECT_TO_SSL:false}
netgrif.engine.mail.default-encoding=UTF-8
netgrif.engine.mail.host=${NETGRIF_ENGINE_MAIL_HOST:''}
netgrif.engine.mail.username=${NETGRIF_ENGINE_MAIL_USERNAME:''}
netgrif.engine.mail.password=${NETGRIF_ENGINE_MAIL_PASSWORD:''}
netgrif.engine.mail.port=${NETGRIF_ENGINE_MAIL_PORT:25}
netgrif.engine.mail.properties.mail.debug=false
netgrif.engine.mail.properties.mail.smtp.debug=false
netgrif.engine.mail.properties.mail.smtp.auth=${NETGRIF_ENGINE_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
netgrif.engine.mail.properties.mail.smtp.starttls.enable=${NETGRIF_ENGINE_MAIL_SMTP_STARTTLS_ENABLE:true}
netgrif.engine.mail.properties.mail.smtp.starttls.required=${NETGRIF_ENGINE_MAIL_SMTP_REQUIRED_ENABLE:true}
netgrif.engine.mail.protocol=${NETGRIF_ENGINE_MAIL_PROTOCOL:smtp}

# Security
netgrif.engine.security.csrf=false
netgrif.engine.security.realm-name=NAE-Realm
netgrif.engine.security.encryption.password=${NETGRIF_ENGINE_SECURITY_ENCRYPTION_PASSWORD:password}
netgrif.engine.security.encryption.algorithm=PBEWITHSHA256AND256BITAES-CBC-BCE
netgrif.engine.security.auth.open-registration=${NETGRIF_ENGINE_SECURITY_AUTH_OPEN_REGISTRATION:true}
netgrif.engine.security.auth.token-validity-period=3
netgrif.engine.security.auth.minimal-password-length=8
netgrif.engine.security.auth.enable-profile-edit=true
netgrif.engine.security.auth.admin-password=${NETGRIF_ENGINE_SECURITY_AUTH_ADMIN_PASSWORD:password}
netgrif.engine.security.auth.no-authentication-patterns=
netgrif.engine.security.static.enabled=false
netgrif.engine.security.headers.hsts.enable=true
netgrif.engine.security.headers.hsts.include-sub-domains=true
netgrif.engine.security.limits.login-attempts=50
netgrif.engine.security.limits.login-timeout=1
netgrif.engine.security.limits.login-timeout-unit=days
netgrif.engine.security.limits.email-sends-attempts=2
netgrif.engine.security.limits.email-block-duration=1
netgrif.engine.security.limits.email-block-time-type=days
netgrif.engine.security.jwt.expiration=900000
netgrif.engine.security.jwt.algorithm=RSA
netgrif.engine.security.jwt.private-key=file:src/main/resources/certificates/private.der
netgrif.engine.security.server-patterns=/api/auth/signup,/api/auth/token/verify,/api/auth/reset,/api/auth/recover,/api/public/**,/v3/api-docs/public,/manage/health
netgrif.engine.security.anonymous-exceptions=/api/auth/signup,/api/auth/token/verify,/api/auth/reset,/api/auth/recover,/manage/health
netgrif.engine.security.providers=NetgrifBasicAuthenticationProvider

# Swagger and server
netgrif.engine.swagger.enabled=false
netgrif.engine.server.port=8080
netgrif.engine.server.error.include-stacktrace=never

# Quartz (overrides quartz.properties)
org.quartz.jobStore.class=com.novemberain.quartz.mongodb.MongoDBJobStore
org.quartz.threadPool.threadCount=1
org.quartz.scheduler.instanceName=netgrif_onloadcode
spring.quartz.properties.org.quartz.scheduler.instanceName=quartz-nae
spring.quartz.properties.org.quartz.jobStore.isClustered=false
nae.quartz.dbName=${NETGRIF_ENGINE_DATA_DATABASE_NAME:nae}
org.quartz.jobStore.collectionPrefix=netgrif_quartz_

# Engine runners and caches
netgrif.engine.runner.expression-runner.cache-size=200
netgrif.engine.cache.action-cache-size=500
netgrif.engine.cache.functions-cache-size=500
netgrif.engine.cache.global-functions-cache-size=500

# Postal codes
netgrif.engine.postal-code.enable-import=true
netgrif.engine.postal-code.import-file-path=postal_codes.csv

# Storage
netgrif.engine.storage.clean=false
netgrif.engine.storage.path=storage
netgrif.engine.storage.archived-path=storage/uploadedModels/
netgrif.engine.storage.default-type=local

# PDF generator
netgrif.engine.pdf.resources.output-folder=storage
netgrif.engine.pdf.resources.output-default-name=generated_pdf.pdf
netgrif.engine.pdf.resources.template-resource=file:src/main/resources/pdfGenerator/header_template5.pdf
netgrif.engine.pdf.resources.font-title-resource=file:src/main/resources/pdfGenerator/fonts/Roboto-Light.ttf
netgrif.engine.pdf.resources.font-label-resource=file:src/main/resources/pdfGenerator/fonts/Roboto-Light.ttf
netgrif.engine.pdf.resources.font-value-resource=file:src/main/resources/pdfGenerator/fonts/Roboto-Light.ttf
netgrif.engine.pdf.resources.check-box-checked-resource=file:src/main/resources/pdfGenerator/img/checkbox_checked.svg
netgrif.engine.pdf.resources.check-box-un-checked-resource=file:src/main/resources/pdfGenerator/img/checkbox_unchecked.svg
netgrif.engine.pdf.resources.radio-checked-resource=file:src/main/resources/pdfGenerator/img/radio_checked.svg
netgrif.engine.pdf.resources.radio-un-checked-resource=file:src/main/resources/pdfGenerator/img/radio_unchecked.svg
netgrif.engine.pdf.resources.boolean-checked-resource=file:src/main/resources/pdfGenerator/img/radio_checked.svg
netgrif.engine.pdf.resources.boolean-unchecked-resource=file:src/main/resources/pdfGenerator/img/radio_unchecked.svg

# LDAP (NAE User configuration)
nae.ldap.enabled=false
nae.ldap.url=ldap://${LDAP_IP:''}:389
nae.ldap.username=${LDAP_USERNAME:''}
nae.ldap.password=${LDAP_PASSWORD:''}
nae.ldap.base=${LDAP_BASE:''}
nae.ldap.userFilter=cn={0}
nae.ldap.peopleSearchBase=ou=people
nae.ldap.groupSearchBase=ou=groups
nae.ldap.peopleClass=inetOrgPerson,person
#nae.ldap.mapHomeDirectory=displayName

# Impersonation
netgrif.engine.impersonation.redis-namespace=${NETGRIF_ENGINE_DATA_DATABASE_NAME:nae}:impersonation:impersonator
netgrif.engine.impersonation.enabled=${NETGRIF_ENGINE_IMPERSONATION_ENABLED:true}

# Groups (NAE User configuration)
nae.group.defaultEnabled=true
nae.group.systemEnabled=true

# Data handling
netgrif.engine.data.image-preview-scaling-px=400
netgrif.engine.data.validation.set-data-enabled=false
netgrif.engine.filter.export.file-name=filters.xml

# Actuator
netgrif.engine.management.endpoints.web.base-path=/manage
netgrif.engine.management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,threaddump,heapdump,mappings,conditions,configprops,scheduledtasks,caches,flyway,liquibase,prometheus
netgrif.engine.management.endpoint.health.show-details=when_authorized
netgrif.engine.management.endpoint.health.show-components=when_authorized
netgrif.engine.management.endpoint.health.roles=ADMIN
netgrif.engine.management.health.elasticsearch.enabled=false
netgrif.engine.management.health.ldap.enabled=false
netgrif.engine.management.health.mail.enabled=false


# Logging levels
netgrif.engine.logging.level.org.springframework.data.elasticsearch.core=info
netgrif.engine.logging.level.org.springframework.data.mongodb.core.MongoTemplate=info
netgrif.engine.logging.level.com.netgrif.application.engine.elastic.service=info
netgrif.engine.logging.level.com.netgrif.application.engine.petrinet.domain.dataset.logic.action.FieldActionsRunner=debug
netgrif.engine.logging.level.com.netgrif.application.engine.petrinet.domain.dataset.logic.action.runner.RoleActionsRunner=debug
netgrif.engine.logging.level.com.netgrif.application.engine.petrinet.domain.dataset.logic.action.runner.CaseFieldsExpressionRunner=debug

# Action imports
netgrif.engine.actions.imports=com.netgrif.application.engine.objects.workflow.domain.menu.MenuItemBody,com.netgrif.application.engine.objects.petrinet.domain.I18nString,com.netgrif.application.engine.objects.workflow.domain.menu.dashboard.DashboardManagementBody,com.netgrif.application.engine.objects.workflow.domain.menu.dashboard.DashboardItemBody,com.netgrif.application.engine.objects.utils.Nullable
